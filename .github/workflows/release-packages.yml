# Synced from https://github.com/curiosus-dev/dotnet-tools, do not edit in place.
#
# Publishes packages to nuget.org via NuGet Trusted Publishing (OIDC, no long-lived API keys)
# and creates a tag and a GitHub release for every new package version.
# Also updates coverage badges in the `badges` branch: coverage.json for the repository and <PackageId>.json
# per package, shields.io endpoint badges:
# https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/<owner>/<repository>/badges/coverage.json
# nuget.org policy: owner = repository owner, repository = this repository, workflow file = release-packages.yml,
# environment = nuget. The nuget environment (dotnet-tools/settings/environments.json) deploys from main and release/*
# only: a workflow file can be changed in any branch, the environment branch policy can't, so only those branches get
# a token nuget.org accepts. release/* branches can be created by admins only (restrict-release-branches ruleset).
# Required repository secret: NUGET_USER - nuget.org profile name (not an email).

name: Release packages

on:
  push:
    branches: [ main, 'release/*' ] # release/<major>.x: maintenance of an older major
  workflow_dispatch:

concurrency:
  group: release-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # workflow_dispatch can be started on any branch.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Build and test
        run: dotnet cake --target=CoverageReport
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: artifacts/coverage-report/
      - name: Pack
        run: dotnet cake --target=Pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # OIDC token for NuGet Trusted Publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts/packages/
      # The temporary API key lives 1 hour, so it is requested right before the push.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages and create GitHub releases
        run: dotnet cake --target=Publish
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  # Separate from publish, so a failed badge update never blocks a release.
  coverage-badge:
    needs: build
    # Badges show the default branch, not maintenance releases.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits to the badges branch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report/
      - name: Update coverage badges
        env:
          BADGES: ${{ runner.temp }}/coverage-report/badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges; then
            git switch -c badges FETCH_HEAD
          else
            git switch --orphan badges
          fi

          # Badges of removed packages go away too.
          git rm -q --ignore-unmatch -- '*.json'
          cp "$BADGES"/*.json .
          git add -- '*.json'
          coverage=$(jq -r .message coverage.json)
          if git diff --cached --quiet; then
            echo "Coverage is unchanged: $coverage"
            exit 0
          fi
          git commit -m "Update coverage badges ($coverage)"
          git push origin badges
