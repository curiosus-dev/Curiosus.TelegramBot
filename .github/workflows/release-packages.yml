# Synced from https://github.com/curiosus-dev/dotnet-tools, do not edit in place.
#
# Publishes packages to nuget.org via NuGet Trusted Publishing (OIDC, no long-lived API keys)
# and creates a tag and a GitHub release for every new package version.
# nuget.org policy: owner = repository owner, repository = this repository, workflow file = release-packages.yml.
# Required repository secret: NUGET_USER - nuget.org profile name (not an email).

name: Release packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: release-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Build and test
        run: dotnet cake --target=Default
      - name: Pack
        run: dotnet cake --target=Pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # OIDC token for NuGet Trusted Publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts/packages/
      # The temporary API key lives 1 hour, so it is requested right before the push.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages and create GitHub releases
        run: dotnet cake --target=Publish
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}
