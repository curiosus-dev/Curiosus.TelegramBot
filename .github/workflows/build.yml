# Synced from https://github.com/curiosus-dev/dotnet-tools, do not edit in place.
# Runs the same Cake pipeline as a local `dotnet cake --target=CoverageReport`: build, tests and a coverage report
# in the run summary. Pushes to the default branch are covered by release-packages.yml, which runs the same
# build and tests before publishing and updates the coverage badge.

name: Build and test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Build and test
        run: dotnet cake --target=CoverageReport
      - name: Coverage summary
        run: cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: artifacts/coverage-report/
